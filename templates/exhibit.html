<!--Страница для экспоната-->
{% extends "base.html" %}
{% block title %}{{ exhibit.title }}{% endblock %}
{% block header %}
<a href="index.html" class="back-btn">← Назад к списку</a>
{% endblock %}
{% block content %}
<div class="exhibit-page">
    <img src="{{ exhibit.image }}" class="exhibit-image">
    <h1 class="exhibit-title">{{ exhibit.title }}</h1>
    <p class="exhibit-description">{{ exhibit.description }}</p>
    <div class="audio-player">
        <div class="player-controls">
            <button class="play-btn" id="play-btn">▶️</button>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
        </div>
    </div>
    <audio id="audio" src="{{ exhibit.audio }}" preload="metadata"></audio>
</div>
{% endblock %}
