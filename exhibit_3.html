<!DOCTYPE html>
<html lang="ru">
<head>
<base href="/projectmuseum/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Первая ручка в этой школе</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        
<a href="index.html" class="back-btn">Назад к списку</a>

        <button id="theme-toggle" class="theme-btn">Moon</button>
    </header>
    <main>
<div class="exhibit-page">
    <img src="images/exp3.jpg" class="exhibit-image">
    <h1 class="exhibit-title">Первая ручка в этой школе</h1>
    <p class="exhibit-description">Остаток более развитой цивилизации</p>

            <button class="play-btn" id="play-btn">Play</button>

                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
        </div>
    </div>
    <audio id="audio" src="audio/exp3.mp3" preload="metadata"></audio>
</div>
</main>
    <footer><p>2026 Школьный музей</p></footer>
    <script src="script.js"></script>
